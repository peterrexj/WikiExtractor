# ---- Attribute preservation ----
# Required for: SQLite-net attribute mapping, Crashlytics line numbers,
# generic type resolution in DI, and annotation-based APIs.
-keepattributes Signature,*Annotation*,EnclosingMethod,InnerClasses,SourceFile,LineNumberTable,Exceptions

# ---- Firebase ----
-keep class com.google.firebase.** { *; }
-keep class com.google.firebase.provider.FirebaseInitProvider { *; }
-keep class com.google.firebase.crashlytics.** { *; }
-keep class com.google.firebase.installations.** { *; }
-keep class com.google.android.datatransport.** { *; }
-keep interface com.google.android.datatransport.** { *; }
-keep class com.crashlytics.** { *; }

# ---- GMS Tasks (required by all Firebase and GMS APIs) ----
-keep class com.google.android.gms.tasks.** { *; }

# ---- Google Ads ----
-keep class com.google.android.gms.ads.** { *; }
-keep class com.google.android.gms.measurement.** { *; }
-keep class com.google.android.gms.ads.MobileAdsInitProvider { *; }
-keep class androidx.core.app.CoreComponentFactory { *; }

# ---- AppCenter ----
-keep class com.microsoft.appcenter.** { *; }
-keepnames class com.microsoft.appcenter.** { *; }

# ---- MAUI infrastructure ----
-keep class com.microsoft.maui.** { *; }
-keep class microsoft.maui.** { *; }
# Auto-generated Java proxy classes — critical for MAUI/Mono interop
-keep class crc64** { *; }
-keep interface crc64** { *; }
# Mono runtime
-keep class mono.** { *; }
-keep class microsoft.device.** { *; }

# ---- Material / AndroidX UI ----
-keep class com.google.android.material.** { *; }
-keep class androidx.appcompat.app.AppCompatDelegate { *; }
-keep class androidx.appcompat.app.AppCompatViewInflater { *; }
-keep class androidx.appcompat.resources.** { *; }
-keepclassmembers class androidx.appcompat.app.AppCompatDelegate {
    static void setDefaultNightMode(int);
}

# ---- Lifecycle / State restoration ----
-keep class androidx.lifecycle.** { *; }
-keep class androidx.savedstate.** { *; }
-keep class androidx.activity.** { *; }
-keep class androidx.lifecycle.Recreator { *; }
-keep interface androidx.savedstate.SavedStateRegistry$AutoRecreated { *; }
-keepclassmembers class * implements androidx.savedstate.SavedStateRegistry$AutoRecreated {
    <init>(...);
}

# ---- RecyclerView (Syncfusion ListView uses RecyclerView internally) ----
# R8 renames onScrolled/onScrollStateChanged overrides, breaking AbstractMethodError at runtime
-keep class androidx.recyclerview.widget.RecyclerView { *; }
-keep class androidx.recyclerview.widget.RecyclerView$OnScrollListener { *; }
-keepclassmembers class * extends androidx.recyclerview.widget.RecyclerView$OnScrollListener {
    void onScrolled(androidx.recyclerview.widget.RecyclerView, int, int);
    void onScrollStateChanged(androidx.recyclerview.widget.RecyclerView, int);
}
-keepclassmembers class * extends androidx.recyclerview.widget.RecyclerView$Adapter {
    *;
}
-keepclassmembers class * extends androidx.recyclerview.widget.RecyclerView$ViewHolder {
    *;
}
-keepclassmembers class * extends androidx.recyclerview.widget.RecyclerView$LayoutManager {
    *;
}
-keepclassmembers class * extends androidx.recyclerview.widget.RecyclerView$ItemDecoration {
    *;
}

# ---- Fragment ----
-keep class androidx.fragment.app.Fragment { *; }
-keep class androidx.fragment.app.FragmentManager { *; }
-keep class androidx.fragment.app.FragmentTransaction { *; }
-keepclassmembers class androidx.fragment.app.FragmentTransaction {
    androidx.fragment.app.FragmentTransaction add(int, androidx.fragment.app.Fragment);
    androidx.fragment.app.FragmentTransaction replace(int, androidx.fragment.app.Fragment);
    int commit();
}
