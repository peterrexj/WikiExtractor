# ---- Attribute preservation ----
-keepattributes Signature,*Annotation*,EnclosingMethod,InnerClasses,SourceFile,LineNumberTable,Exceptions

# ---- Firebase ----
-keep class com.google.firebase.** { *; }
-keep class com.google.firebase.provider.FirebaseInitProvider { *; }
-keep class com.google.firebase.crashlytics.** { *; }
-keep class com.google.firebase.installations.** { *; }
-keep class com.google.android.datatransport.** { *; }
-keep interface com.google.android.datatransport.** { *; }
-keep class com.crashlytics.** { *; }

# ---- GMS ----
-keep class com.google.android.gms.** { *; }
-keep interface com.google.android.gms.** { *; }

# ---- Google Ads / Material ----
-keep class com.google.android.material.** { *; }
-keep interface com.google.android.material.** { *; }

# ---- AppCenter ----
-keep class com.microsoft.appcenter.** { *; }
-keepnames class com.microsoft.appcenter.** { *; }

# ---- MAUI / Mono infrastructure ----
-keep class com.microsoft.maui.** { *; }
-keep class microsoft.maui.** { *; }
-keep class crc64** { *; }
-keep interface crc64** { *; }
-keep class mono.** { *; }
-keep class microsoft.device.** { *; }

# ---- AndroidX (keep entire namespace — Syncfusion and MAUI use many classes via reflection) ----
-keep class androidx.** { *; }
-keep interface androidx.** { *; }
-keepclassmembers class androidx.** { *; }
