# --- Google Ads & AndroidX (From previous fix) ---
-keep class com.google.android.gms.ads.** { *; }
-keep class com.google.android.gms.measurement.** { *; }
-keep class androidx.core.app.CoreComponentFactory { *; }
-keep class com.google.android.gms.ads.MobileAdsInitProvider { *; }

# --- MAUI Infrastructure ---
# Preserve the PlatformDispatcher and other MAUI internals
-keep class com.microsoft.maui.** { *; }

# Preserve Android-specific MAUI types
-keep class microsoft.maui.** { *; }

# Preserve the auto-generated Java Proxy classes (very important!)
-keep class crc64** { *; }
-keep interface crc64** { *; }

# Preserve Mono Runtime components
-keep class mono.** { *; }
-keep class microsoft.device.** { *; }

# Optional: If you use community toolkit or other plugins
-keep class com.google.android.material.** { *; }

# Preserve AppCompatDelegate to fix NoSuchMethodError for night mode
-keep class androidx.appcompat.app.AppCompatDelegate { *; }
-keep class androidx.appcompat.app.AppCompatViewInflater { *; }

# Keep AppCompat Resources to prevent errors in layouts/theming
-keep class androidx.appcompat.resources.** { *; }

# Also keep the specific method if the broad keep above isn't enough
-keepclassmembers class androidx.appcompat.app.AppCompatDelegate {
    static void setDefaultNightMode(int);
}

# Preserve State Restoration classes
-keep class androidx.lifecycle.** { *; }
-keep class androidx.savedstate.** { *; }
-keep class androidx.activity.** { *; }
-keep class androidx.lifecycle.Recreator { *; }
-keep interface androidx.savedstate.SavedStateRegistry$AutoRecreated { *; }

# Fix for "consumeRestoredStateForKey"
-keepclassmembers class * implements androidx.savedstate.SavedStateRegistry$AutoRecreated {
    <init>(...);
}

# Prevent R8 from stripping Fragment internals
-keep class androidx.fragment.app.Fragment { *; }
-keep class androidx.fragment.app.FragmentManager { *; }
-keep class androidx.fragment.app.FragmentTransaction { *; }

# Specifically keep the 'add' method that is currently missing
-keepclassmembers class androidx.fragment.app.FragmentTransaction {
    androidx.fragment.app.FragmentTransaction add(int, androidx.fragment.app.Fragment);
    androidx.fragment.app.FragmentTransaction replace(int, androidx.fragment.app.Fragment);
    int commit();
}